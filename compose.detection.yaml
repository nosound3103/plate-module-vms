services:
  plate-sync:
    image: plate-module-vms:detection-cpu
    build:
      dockerfile: Dockerfile.inference
      target: cpu
    stop_grace_period: 30s
    volumes:
      - type: bind
        source: ./models/weights
        target: /models
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=256m,mode=1777
