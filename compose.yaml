name: plate-module-vms
services:
  plate-sync:
    image: plate-module-vms:sync
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: true
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
