name: plate-module-vms

x-service: &service
  env_file:
    - path: .env
      required: true
  init: true
  restart: unless-stopped
  stop_grace_period: 75s
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-inference: &inference
  <<: *service
  environment:
    PLATE_OCR_ENABLED: "${PLATE_OCR_ENABLED:-true}"
    PLATE_EVENTS_ENABLED: "${PLATE_EVENTS_ENABLED:-true}"
    PLATE_SNAPSHOT_ENABLED: "${PLATE_SNAPSHOT_ENABLED:-true}"
    PLATE_BBOX_ENABLED: "${PLATE_BBOX_ENABLED:-true}"
    RED_LIGHT_ENABLED: "${RED_LIGHT_ENABLED:-false}"
    RED_LIGHT_SETTINGS: '${RED_LIGHT_SETTINGS:-{"snapshot_dir":"/snapshots/red_light"}}'
  volumes:
    - type: bind
      source: ./models/weights
      target: /models
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./snapshots
      target: /snapshots
  tmpfs:
    - /tmp:size=256m,mode=1777

services:
  plate-sync:
    <<: *inference
    profiles: [gpu]
    mem_limit: "${PLATE_GPU_MEMORY_LIMIT:-5g}"
    memswap_limit: "${PLATE_GPU_MEMORY_LIMIT:-5g}"
    cpus: "${PLATE_GPU_CPUS:-2.0}"
    image: "${PLATE_GPU_IMAGE:-plate-module-vms:detection-cu128}"
    build:
      context: .
      dockerfile: "${PLATE_GPU_DOCKERFILE:-Dockerfile}"
      target: "${PLATE_GPU_TARGET:-gpu}"
      args:
        CUDA_BASE_IMAGE: "${CUDA_BASE_IMAGE:-multi-camera-ai:cu128}"
    gpus: all

  plate-cpu:
    <<: *inference
    profiles: [cpu]
    image: plate-module-vms:detection-cpu
    build:
      context: .
      dockerfile: Dockerfile
      target: cpu

  plate-config:
    <<: *service
    profiles: [sync]
    image: plate-module-vms:sync
    build:
      context: .
      dockerfile: Dockerfile
      target: sync
